[project]
name = "wtp"
version = "0.1.0"
description = "Git worktrees de projetos PHP, cada um com seu próprio vhost no Apache"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
wtp = "wtp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wtp*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
strict = true
python_version = "3.12"
files = ["wtp", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
